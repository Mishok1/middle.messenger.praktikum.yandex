<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Registration</title>
</head>

<body>
    <h1 class="visually-hidden">Registration</h1>

    <section class="registration">
        <div class="registration__container container">
            <form class="registration__form" action="#" method="post" enctype="multipart/form-data">
                <h2 class="registration__title">Регистрация</h2>
                <fieldset class="registration__field">
                    <legend class="visually-hidden">#</legend>
                    <ul class="registration__list">
                        <li class="registration__item">
                            <label class="registration__label">
                                <span class="registration__subtitle">Почта</span>
                                <input class="registration__input" type="text" name="email" placeholder="pochta@yandex.ru">
                            </label>
                            <label class="registration__label">
                                <span class="registration__subtitle">Логин</span>
                                <input class="registration__input" type="text" name="login" placeholder="ivanivanov">
                            </label>
                            <label class="registration__label">
                                <span class="registration__subtitle">Имя</span>
                                <input class="registration__input" type="text" name="first-name" placeholder="Иван">
                            </label>
                            <label class="registration__label">
                                <span class="registration__subtitle">Фамилия</span>
                                <input class="registration__input" type="text" name="second-name" placeholder="Иванов">
                            </label>
                            <label class="registration__label">
                                <span class="registration__subtitle">Пароль</span>
                                <input class="registration__input" type="password" name="password" placeholder="Пароль">
                            </label>
                            <label class="registration__label">
                                <span class="registration__subtitle">Пароль (ещё раз)</span>
                                <input class="registration__input" type="password" name="password-repeat" placeholder="Пароль (ещё раз)">
                            </label>
                        </li>
                    </ul>
                </fieldset>
                <button class="registration__button button" type="submit">Зарегистрироваться</button>
                <button class="registration__button button" type="button">Войти</button>
            </form>
        </div>
    </section>
    <script type="module" src="../../src/pages/registration.js"></script>
</body>

</html>
