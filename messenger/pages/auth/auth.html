<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Authorization</title>
  </head>
  <body>
    <h1 class="visually-hidden">Authorization</h1>
    <section class="login">
      <div class="login__container container">
        <form class="login__form" action="#" method="post">
          <h2 class="login__title">Вход</h2>
          <fieldset class="login__fieldset">
            <legend class="visually-hidden">#</legend>
            <ul class="login__list">
              <li class="login__item">
                <label class="login__label">
                  <span class="login__subtitle">Логин</span>
                  <input class="login__input" type="text" name="login" placeholder="ivanivanov">
                </label>
                <label class="login__label">
                  <span class="login__subtitle">Пароль</span>
                  <input class="login__input" type="password" name="password" placeholder="Пароль">
                </label>
              </li>
            </ul>
          </fieldset>
          <button class="login__button button" type="submit">Авторизоваться</button>
          <button class="login__button button" type="button">Нет аккаунта?</button>
        </form>
      </div>
    </section>
    <script type="module" src="../../src/pages/auth.js"></script>
  </body>
</html>
