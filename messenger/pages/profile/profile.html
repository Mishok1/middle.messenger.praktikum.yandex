<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/vite.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Profile</title>
</head>

<body class="profile">
  <h1 class="visually-hidden">Profile</h1>
  <button class="profile__button" type="button">
    <span class="visually-hidden">Назад</span>
  </button>
  
  <section class="profile">
    <div class="profile__container container">
      <img class="profile__image" src="#" width="130" height="130" alt="Фото профиля.">
      <p class="profile__name">Иван</p>
    </div>

    <form class="profile__form" action="#" method="post">
      <fieldset class="profile__field">
        <legend class="visually-hidden"></legend>
        <ul class="profile__list">
          <li class="profile__item">
            <label class="profile__label">
              <span class="profile__subtitle">Почта</span>
              <input class="profile__input" type="text" name="email" placeholder="pochta@yandex.ru">
            </label>
            <label class="profile__label">
              <span class="profile__subtitle">Логин</span>
              <input class="profile__input" type="text" name="login" placeholder="ivanivanov">
            </label>
            <label class="profile__label">
              <span class="profile__subtitle">Имя</span>
              <input class="profile__input" type="text" name="first-name" placeholder="Иван">
            </label>
            <label class="profile__label">
              <span class="profile__subtitle">Фамилия</span>
              <input class="profile__input" type="text" name="second-name" placeholder="Иванов">
            </label>
            <label class="profile__label">
              <span class="profile__subtitle">Имя в чате</span>
              <input class="profile__input" type="text" name="name-in-chat" placeholder="Иван">
            </label>
            <label class="profile__label">
              <span class="profile__subtitle">Телефон</span>
              <input class="profile__input" type="tel" name="phone" placeholder="+7 (909) 967 30 30">
            </label>
          </li>
        </ul>

        <ul class="profile__buttons">
          <li class="profile__buttons-item">
            <button class="profile__buttons-button" type="button">Изменить данные</button>
          </li>
          <li class="profile__buttons-item">
            <button class="profile__buttons-button" type="button">Изменить пароль</button>
          </li>
          <li class="profile__buttons-item">
            <button class="profile__buttons-button" type="button">Выйти</button>
          </li>
        </ul>
      </fieldset>
    </form>
  </section>

  <script type="module" src="../../src/pages/profile.js"></script>
</body>

</html>
