<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Registration</title>
</head>

<body>
    <h1 class="visually-hidden">Registration</h1>

    <section class="registration">
        <div class="registration__container container">
            <form class="registration__form form" action="#" method="post" enctype="multipart/form-data">
                <h2 class="form__title">Регистрация</h2>
                <fieldset class="form__field">
                    <legend class="visually-hidden">#</legend>
                    <ul class="form__list">
                        <li class="form__item">
                            <label class="form__label">
                                <span class="form__subtitle">Почта</span>
                                <input class="form__input" type="text" name="email" placeholder="pochta@yandex.ru">
                            </label>
                        <li class="form__item">
                            <label class="form__label">
                                <span class="form__subtitle">Логин</span>
                                <input class="form__input" type="text" name="login" placeholder="ivanivanov">
                            </label>
                        </li>
                        <li class="form__item">
                            <label class="form__label">
                                <span class="form__subtitle">Имя</span>
                                <input class="form__input" type="text" name="first_name" placeholder="Иван">
                            </label>
                        </li>
                        <li class="form__item">
                            <label class="form__label">
                                <span class="form__subtitle">Фамилия</span>
                                <input class="form__input" type="text" name="second_name" placeholder="Иванов">
                            </label>
                        </li>
                        <li class="form__item">
                            <label class="form__label">
                                <span class="form__subtitle">Телефон</span>
                                <input class="form__input" type="tel" name="phone" placeholder="+7 (909) 967 30 30">
                            </label>
                        </li>
                        <li class="form__item">
                            <label class="form__label">
                                <span class="form__subtitle">Пароль</span>
                                <input class="form__input" type="password" name="password" placeholder="Пароль">
                            </label>
                        </li>
                        <li class="form__item">
                            <label class="form__label">
                                <span class="form__subtitle">Пароль (ещё раз)</span>
                                <input class="form__input" type="password" name="password-repeat"
                                    placeholder="Пароль (ещё раз)">
                            </label>
                        </li>
                    </ul>
                </fieldset>
                <button class="form__button button button--primary" type="submit">Зарегистрироваться</button>
                <a class="form__link link" href="../auth/auth.html">Войти</a>
            </form>
        </div>
    </section>
    <script type="module" src="./registration.js"></script>
</body>

</html>
